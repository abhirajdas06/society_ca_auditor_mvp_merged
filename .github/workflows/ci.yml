# Branches: main (production), develop (staging), feature/*, hotfix/*.
# Pipeline: lint -> tests (PostgreSQL) -> Django checks -> migration check -> build
#           -> staging deploy (develop) -> UAT approval -> production deploy (main, gated).
name: CI/CD

on:
  push:
    branches: [main, develop, "feature/**", "hotfix/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - run: pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Python syntax
        run: python -m compileall -q config society

  test:
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_DB: society_ci, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/society_ci
      DEBUG: "0"
      SECRET_KEY: ci-only-secret-not-used-anywhere-else
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      SECURE_SSL_REDIRECT: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - run: pip install -r requirements-dev.txt
      - name: Django system checks
        run: python manage.py check --fail-level WARNING
      - name: Deployment checks
        run: python manage.py check --deploy --fail-level ERROR
      - name: Migration check (no missing migrations)
        run: python manage.py makemigrations --check --dry-run
      - name: Collect static files (manifest storage is used when DEBUG=0)
        run: python manage.py collectstatic --noinput
      - name: Apply migrations on empty PostgreSQL
        run: python manage.py migrate --noinput
      - name: Seed demo data (with issued bills and receipts)
        run: python manage.py seed_demo --with-activity && python manage.py seed_demo
        env: {DEMO_PASSWORD: ci-demo-password-123}
      - name: Unit + acceptance tests (includes PostgreSQL row-lock concurrency tests)
        run: pytest -q -rs

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') }}
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy image to staging
        env:
          IMAGE_REF: ${{ env.IMAGE }}:${{ needs.build.outputs.tag }}
          DEPLOY_HOST: ${{ secrets.STAGING_HOST }}
          DEPLOY_USER: ${{ secrets.STAGING_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          HEALTH_URL: ${{ vars.STAGING_URL }}/healthz/
        run: scripts/deploy.sh

  # UAT sign-off: configure the "uat" environment with required reviewers in GitHub settings.
  uat-signoff:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: uat
    steps:
      - run: echo "UAT approved for ${{ needs.build.outputs.tag }} by an environment reviewer."

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, uat-signoff]
    runs-on: ubuntu-latest
    environment:
      name: production   # protected: required reviewers + main-only deployment branch rule
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy image to production
        env:
          IMAGE_REF: ${{ env.IMAGE }}:${{ needs.build.outputs.tag }}
          DEPLOY_HOST: ${{ secrets.PRODUCTION_HOST }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          HEALTH_URL: ${{ vars.PRODUCTION_URL }}/healthz/
        run: scripts/deploy.sh
