{% if page.paginator.num_pages > 1 %}
<div class="pagination small">
  {% if page.has_previous %}<a class="btn small" href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&amp;{% endif %}{% endfor %}page={{ page.previous_page_number }}">‹ Prev</a>{% endif %}
  <span>Page {{ page.number }} of {{ page.paginator.num_pages }} ({{ page.paginator.count }} rows)</span>
  {% if page.has_next %}<a class="btn small" href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&amp;{% endif %}{% endfor %}page={{ page.next_page_number }}">Next ›</a>{% endif %}
</div>
{% endif %}
