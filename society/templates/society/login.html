{% load static %}<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Society CA</title><link rel="stylesheet" href="{% static 'society/css/app.css' %}"></head>
<body>
<div class="login card">
  <h1>Society CA</h1>
  <p class="muted small">Billing, receivables and audit trail for co-operative housing societies.</p>
  {% if form.errors %}<div class="msg error">Username or password is incorrect.</div>{% endif %}
  <form method="post">{% csrf_token %}
    <div class="field"><label for="id_username">Username</label><input id="id_username" name="username" autocomplete="username" autofocus required></div>
    <div class="field"><label for="id_password">Password</label><input id="id_password" type="password" name="password" autocomplete="current-password" required></div>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn primary" style="width:100%">Sign in</button>
  </form>
</div>
</body></html>
